name: Publish

# Publishes `l1dder` to npm via OIDC Trusted Publishing with provenance on v* tags.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build & Test
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Render release notes (stops here if the tag has no complete RU + EN entry)
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/render-release-notes.mjs "${TAG}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"
